services:
  - type: web
    name: jerrytech-api
    env: python
    region: frankfurt
    plan: free
    buildCommand: cd flask_backend && pip install -r requirements.txt && flask db upgrade
    startCommand: cd flask_backend && gunicorn app:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jerrytech-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://jeytech.onrender.com,http://localhost:5500,http://127.0.0.1:5500
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

databases:
  - name: jerrytech-db
    plan: free
    region: frankfurt
