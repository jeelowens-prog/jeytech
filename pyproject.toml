[tool.poetry]
name = "jeytech"
version = "0.1.0"
description = "FastAPI backend for JeyTech"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "0.104.1"
uvicorn = "0.24.0"
sqlalchemy = "2.0.23"
pydantic = "2.5.0"
pydantic-email = "2.5.0"
python-jose[cryptography] = "3.3.0"
passlib[bcrypt] = "1.7.4"
python-multipart = "0.0.6"
cloudinary = "1.36.0"
python-dotenv = "1.0.0"
pillow = "10.1.0"
alembic = "1.13.0"
psycopg2-binary = "2.9.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
